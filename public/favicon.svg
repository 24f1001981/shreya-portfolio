<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#1e1040"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.4"/>
    </radialGradient>
  </defs>

  <!-- Base dark circle -->
  <circle cx="50" cy="50" r="48" fill="#0b0f19"/>

  <!-- Gradient overlay -->
  <circle cx="50" cy="50" r="48" fill="url(#bg)"/>

  <!-- Orbital ring -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#8B5CF6" stroke-width="1.2" stroke-dasharray="7 3.5" opacity="0.55"/>

  <!-- Orbital accent dots -->
  <circle cx="83" cy="18" r="3.5" fill="#22D3EE" opacity="0.9"/>
  <circle cx="18" cy="82" r="2.5" fill="#F472B6" opacity="0.85"/>

  <!-- SN initials -->
  <text
    x="50" y="60"
    text-anchor="middle"
    font-family="'Syne', 'Segoe UI', sans-serif"
    font-weight="800"
    font-size="34"
    fill="#ffffff"
    letter-spacing="-1.5"
    opacity="0.95"
  >SN</text>

  <!-- Lightning bolt accent (bottom-right of center) -->
  <polygon
    points="60,54  55,65  60,65  50,80  55,69  50,69"
    fill="#22D3EE"
    opacity="0.92"
  />
</svg>
